# docker compose up --build
# order-service:    http://localhost:8080   inventory (réplicas): via rede interna
# Prometheus:       http://localhost:9090   Grafana: http://localhost:3000 (admin/admin)
# Jaeger (traces):  http://localhost:16686
services:
  inventory-service:
    build: { context: ., args: { MODULE: inventory-service } }
    deploy:
      replicas: 2            # escala horizontal: o DNS do compose balanceia entre réplicas
      resources:
        limits: { cpus: "0.5", memory: 384M }   # limite do container (escala vertical = subir estes valores)

  order-service:
    build: { context: ., args: { MODULE: order-service } }
    ports: ["8080:8080"]
    environment:
      INVENTORY_URL: http://inventory-service:8081
      OTLP_TRACING_ENDPOINT: http://jaeger:4318/v1/traces
    depends_on: [inventory-service, jaeger]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 384M }

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.2.2
    ports: ["3000:3000"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./observability/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    depends_on: [prometheus]

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686"]
