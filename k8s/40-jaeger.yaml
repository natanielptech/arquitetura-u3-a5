apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: demo
spec:
  replicas: 1
  selector:
    matchLabels: { app: jaeger }
  template:
    metadata:
      labels: { app: jaeger }
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0
          env: [{ name: COLLECTOR_OTLP_ENABLED, value: "true" }]
          ports: [{ containerPort: 16686 }, { containerPort: 4318 }]
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: demo
spec:
  selector: { app: jaeger }
  ports:
    - { name: ui, port: 16686 }
    - { name: otlp-http, port: 4318 }
