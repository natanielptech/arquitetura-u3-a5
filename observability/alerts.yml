# Exemplo de regras de alerta baseadas nos 4 golden signals.
groups:
  - name: order-service
    rules:
      - alert: HighErrorRate
        expr: sum(rate(http_server_requests_seconds_count{application="order-service",status=~"5.."}[5m])) / sum(rate(http_server_requests_seconds_count{application="order-service"}[5m])) > 0.05
        for: 5m
        labels: { severity: page }
      - alert: HighLatencyP99
        expr: histogram_quantile(0.99, sum by (le) (rate(http_server_requests_seconds_bucket{application="order-service"}[5m]))) > 1
        for: 5m
        labels: { severity: ticket }
      - alert: InventoryCircuitOpen
        expr: resilience4j_circuitbreaker_state{name="inventory",state="open"} == 1
        for: 1m
        labels: { severity: ticket }
